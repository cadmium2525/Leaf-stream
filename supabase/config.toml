# Supabase CLI 設定（ローカル開発・デプロイ用の最小構成）
project_id = "leaf-stream"

[api]
port = 54321
schemas = ["public"]
max_rows = 100

[db]
port = 54322
major_version = 17

[auth]
site_url = "https://cadmium2525.github.io/Leaf-stream/"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true
# 登録なし（ゲスト）で遊べるように匿名サインインを許可
enable_anonymous_sign_ins = true

# メールでの登録・ログインは使わない（匿名プレイヤーのみ）
[auth.email]
enable_signup = false
enable_confirmations = false

# 認証は各関数の中で requireUser() が行う（新しい API キー方式でも動くようにゲートウェイ検証は使わない）
[functions.leaf-register]
verify_jwt = false

[functions.race-challenge]
verify_jwt = false

[functions.race-resolve]
verify_jwt = false

[functions.account-delete]
verify_jwt = false
