name: Supabase deploy

# supabase/ 以下が変わったら、DB マイグレーションと Edge Functions を本番へ反映する。
# 必要なシークレット（Settings → Secrets and variables → Actions → Secrets）:
#   SUPABASE_ACCESS_TOKEN  … Supabase の個人アクセストークン
#   SUPABASE_PROJECT_REF   … プロジェクト ID（URL の https://<ここ>.supabase.co）
#   SUPABASE_DB_PASSWORD   … プロジェクト作成時に決めたデータベースのパスワード
# 未設定なら何もしない。

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'packages/sim-core/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: シークレット確認
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase のシークレットが未設定のためスキップします"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: トークンの形式を確認（前後の空白・改行は自動で取り除く）
        if: steps.secrets.outputs.ready == 'true'
        run: |
          token=$(printf %s "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          ref=$(printf %s "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"
          if ! printf %s "$token" | grep -Eq '^sbp_[0-9a-f]{40}$'; then
            echo "::error::SUPABASE_ACCESS_TOKEN の形式が CLI の期待（sbp_ ＋ 英数字 40 文字）と違います。Access Tokens 画面の「Create legacy token」で作り直して Secret を更新してください。"
            exit 1
          fi
          if ! printf %s "$ref" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF はプロジェクト ID（英小文字と数字 20 文字）を入れてください。URL 全体ではありません。"
            exit 1
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
      - name: sim-core のコピーが最新か
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/sync-sim.mjs --check
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: プロジェクトに接続
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: DB マイグレーション
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --yes
      - name: Edge Functions
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
